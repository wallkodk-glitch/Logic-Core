# Generated by scripts/generate-mobile-workflow.py. Do not edit the embedded driver.
name: Mobile release Logic Core

on:
  push:
    branches: [main]
    paths: [logic-core-mobile-release.zip]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logic-core-pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  # Trusted bootstrap controller; archive-provided scripts never run with contents: write.
  RELEASE_DRIVER: |
__RELEASE_DRIVER__

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
      version: ${{ steps.stage.outputs.version }}
    steps:
      - name: Checkout the ZIP upload
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate archive and extract to staging
        id: stage
        run: |
          python3 -c "$RELEASE_DRIVER" stage \
            --archive "$GITHUB_WORKSPACE/logic-core-mobile-release.zip" \
            --repository "$GITHUB_WORKSPACE" --staging "$RUNNER_TEMP/logic-core-stage"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked staged dependencies
        working-directory: ${{ runner.temp }}/logic-core-stage
        run: npm ci --no-audit --no-fund
      - name: Test staged app and release safety
        working-directory: ${{ runner.temp }}/logic-core-stage
        run: npm test
      - name: Typecheck, build and verify staged deployment assets
        working-directory: ${{ runner.temp }}/logic-core-stage
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify tested source still matches uploaded bytes
        env:
          RELEASE_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          python3 -c "$RELEASE_DRIVER" verify \
            --archive "$GITHUB_WORKSPACE/logic-core-mobile-release.zip" \
            --repository "$GITHUB_WORKSPACE" --staging "$RUNNER_TEMP/logic-core-stage" \
            --digest "$RELEASE_DIGEST"
      - name: Upload tested release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: validated-mobile-release
          path: logic-core-mobile-release.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/logic-core-stage/dist

  install:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.install.outputs.commit }}
    steps:
      - name: Checkout the exact ZIP upload
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download tested release ZIP
        uses: actions/download-artifact@v4
        with:
          name: validated-mobile-release
          path: ${{ runner.temp }}/validated-mobile-release
      - name: Revalidate, install and commit tested source
        id: install
        env:
          RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
          UPLOAD_SHA: ${{ github.sha }}
        run: |
          python3 -c "$RELEASE_DRIVER" install \
            --archive "$RUNNER_TEMP/validated-mobile-release/logic-core-mobile-release.zip" \
            --repository "$GITHUB_WORKSPACE" --staging "$RUNNER_TEMP/logic-core-install" \
            --digest "$RELEASE_DIGEST" --sha "$UPLOAD_SHA"

  deploy:
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse deployment if main advanced after installation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.install.outputs.commit }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      # GITHUB_TOKEN source commits do not start another push workflow.
      - name: Deploy tested artifact in this same run
        id: deployment
        uses: actions/deploy-pages@v4
