name: Deploy Logic Core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logic-core-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only the first mobile installation uses write permission to commit source.
      contents: write
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install source from mobile upload (first run only)
        if: ${{ hashFiles('package.json') == '' }}
        run: |
          test -f logic-core-v0.1.zip
          unzip -o logic-core-v0.1.zip
          test -f package-lock.json
          test -f src/main.tsx
          rm logic-core-v0.1.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- . ':!.github'
          git commit -m "Install Logic Core v0.1 source from mobile upload"
          git push origin HEAD:main
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test data layer and deployment configuration
        run: npm test
      - name: Typecheck, build and verify app
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
